plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.cwengineering.calculator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cwengineering.calculator'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        // Chaquopy requires explicit ABI filters for the Python runtime.
        // Include the two common Android phone architectures.
        ndk {
            abiFilters 'arm64-v8a'
        }

        python {
            version '3.12'
            pip {
                install 'Flask==3.1.1'
                install 'sympy==1.14.0'
            }
        }
    }
}
